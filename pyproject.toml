[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layered-delivery"
version = "0.20.1"
description = "Recursive GROUP/TASK delivery Graph scheduling for pluggable Loops"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
