[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layered-delivery"
version = "0.11.1"
description = "Human-reviewable layered delivery governance for AI-assisted development"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hdg = "hdg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
