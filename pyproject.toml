[project]
name = "layered-delivery"
version = "0.17.0"
description = "Outer Graph scheduling for pluggable software delivery Task Loops"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
