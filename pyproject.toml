[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-graph"
version = "0.39.3"
description = "Delivery Graph control plane for Git baselines, layered execution, reviews, and recovery"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hdg = ["assets/*.html"]
